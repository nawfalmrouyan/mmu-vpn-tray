# MMU Fortinet SSL-VPN OpenFortiVPN Configuration
#
# This file is installed as /etc/openfortivpn/mmu-vpn.conf (root:root, 0644).
# Keep it root-owned: mmu-vpn-tray runs openfortivpn through passwordless
# sudo, and openfortivpn options such as pppd-plugin/pppd-log can execute or
# write files as root if a non-root user can edit this file.

# Gateway details
host = vpn.mmu.edu.my
port = 443

# SAML authentication (opens default browser)
saml-login = 1

# DNS management: set-dns=0 avoids overriding global resolvers.
# mmu-vpn-tray configures split-DNS automatically via systemd-resolved (resolvectl)
set-dns = 0
use-resolvconf = 1
pppd-use-peerdns = 1

# Routing: route internal campus networks without hijacking full internet
set-routes = 1
half-internet-routes = 0
